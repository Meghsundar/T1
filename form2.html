<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pharma ERP - Simple Data Form</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-form2">
  <div class="erp-shell" id="erpShell">
    <aside class="erp-sidebar">
      <div class="brand">
        <i class="bi bi-capsule-pill"></i>
        <span class="brand-name">Pharma ERP</span>
      </div>

      <nav class="menu-wrap">
        <button class="menu-link"><i class="bi bi-speedometer2"></i><span class="menu-text">Dashboard</span></button>
        <button class="menu-link"><i class="bi bi-gear-wide-connected"></i><span class="menu-text">Production</span></button>
        <button class="menu-link"><i class="bi bi-clipboard2-pulse"></i><span class="menu-text">Quality Control</span></button>
        <button class="menu-link"><i class="bi bi-shield-check"></i><span class="menu-text">Quality Assurance</span></button>
        <button class="menu-link active"><i class="bi bi-box-seam"></i><span class="menu-text">Inventory</span></button>
        <button class="menu-link"><i class="bi bi-truck"></i><span class="menu-text">Distribution</span></button>
        <button class="menu-link"><i class="bi bi-cash-stack"></i><span class="menu-text">Accounts</span></button>
        <button class="menu-link"><i class="bi bi-people"></i><span class="menu-text">CRM / Clients</span></button>
        <button class="menu-link"><i class="bi bi-sliders"></i><span class="menu-text">Settings</span></button>
      </nav>

      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar" title="Collapse / expand menu">
        <i class="bi bi-arrow-left"></i>
        <span class="toggle-label">Collapse</span>
      </button>
    </aside>

    <main class="erp-main form2-main">
      <div class="content-header">
        Quick Master Form <span class="sub">/ Form2</span>
      </div>

      <div class="form2-wrap">
        <div class="form2-card">
          <div class="form2-title">Add New Record</div>
          <form class="row g-2">
            <div class="col-md-5">
              <label class="form-label">Field 1 *</label>
              <input class="form-control form-control-sm" placeholder="Enter first value" />
            </div>
            <div class="col-md-5">
              <label class="form-label">Field 2 *</label>
              <input class="form-control form-control-sm" placeholder="Enter second value" />
            </div>
            <div class="col-md-2 d-flex align-items-end">
              <button class="btn btn-primary btn-sm w-100" type="button">
                <i class="bi bi-plus-lg"></i> Add
              </button>
            </div>
          </form>
        </div>

        <div class="form2-card">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="form2-title mb-0">Saved / Old Data</div>
            <button class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-repeat"></i> Refresh</button>
          </div>

          <div class="table-responsive">
            <table class="table table-bordered table-sm mb-0 form2-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Field 1</th>
                  <th>Field 2</th>
                  <th>Created On</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                <tr><td>1</td><td>RM-001</td><td>Acetone</td><td>2026-03-25</td><td class="text-success">Active</td></tr>
                <tr><td>2</td><td>RM-002</td><td>Ethanol</td><td>2026-03-24</td><td class="text-success">Active</td></tr>
                <tr><td>3</td><td>RM-003</td><td>Binder-X</td><td>2026-03-20</td><td class="text-warning">Pending</td></tr>
                <tr><td>4</td><td>RM-004</td><td>Solvent-Y</td><td>2026-03-18</td><td class="text-danger">Inactive</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <footer class="status-bar">
      <div class="status-left">
        <span>Malay Bhalodiya</span>
        <span>|</span>
        <span>Role: Admin</span>
        <span>|</span>
        <span><span class="dot"></span> System Healthy</span>
      </div>
      <div class="status-right">
        <i class="bi bi-gear-fill"></i>
        <span>More</span>
        <i class="bi bi-chevron-down"></i>
      </div>
    </footer>
  </div>

  <script>
    const shell = document.getElementById('erpShell');
    const toggleBtn = document.getElementById('sidebarToggle');

    toggleBtn.addEventListener('click', () => {
      shell.classList.toggle('sidebar-collapsed');
      const icon = toggleBtn.querySelector('i');
      const label = toggleBtn.querySelector('.toggle-label');
      const collapsed = shell.classList.contains('sidebar-collapsed');

      icon.className = collapsed ? 'bi bi-arrow-right' : 'bi bi-arrow-left';
      label.textContent = collapsed ? 'Expand' : 'Collapse';
    });
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"
  ></script>
</body>
</html>
