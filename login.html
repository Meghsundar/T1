<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pharma ERP - Login</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />

  <style>
    :root {
      --login-bg: #eaf0f8;
      --card-bg: #ffffff;
      --brand-blue: #204b86;
      --soft-border: #d8e1ef;
      --soft-text: #5f7392;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(62, 130, 255, 0.14), transparent 36%),
        radial-gradient(circle at 80% 80%, rgba(29, 180, 130, 0.12), transparent 34%),
        var(--login-bg);
      font-family: "Inter", "Segoe UI", Roboto, sans-serif;
      color: #173159;
      padding: 16px;
    }

    .login-card {
      width: min(460px, 100%);
      background: var(--card-bg);
      border: 1px solid var(--soft-border);
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(22, 50, 96, 0.14);
      overflow: hidden;
    }

    .login-head {
      background: linear-gradient(135deg, #214a86, #2e66ad);
      color: #fff;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .login-head i {
      font-size: 1.4rem;
    }

    .login-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.15;
    }

    .login-sub {
      margin: 0;
      font-size: .78rem;
      opacity: .92;
    }

    .login-body {
      padding: 20px 22px 16px;
    }

    .form-label {
      font-size: .82rem;
      font-weight: 600;
      color: #223f6c;
      margin-bottom: 4px;
    }

    .form-control,
    .input-group-text,
    .btn {
      font-size: .85rem;
      min-height: 36px;
    }

    .optional-zone {
      border-top: 1px dashed #cfdaec;
      margin-top: 10px;
      padding-top: 12px;
    }

    .captcha-box {
      height: 36px;
      border: 1px dashed #a9bddc;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f6f9ff;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--brand-blue);
      user-select: none;
    }

    .helper-line {
      color: var(--soft-text);
      font-size: .76rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-head">
      <i class="bi bi-capsule-pill"></i>
      <div>
        <p class="login-title">Pharma ERP Login</p>
        <p class="login-sub">Secure access to inventory and operations</p>
      </div>
    </div>

    <div class="login-body">
      <form>
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input id="username" class="form-control" type="text" placeholder="Enter username" autocomplete="username" />
          </div>
        </div>

        <div class="mb-2">
          <label class="form-label" for="password">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input id="password" class="form-control" type="password" placeholder="Enter password" autocomplete="current-password" />
          </div>
        </div>

        <!-- As requested: OTP and Captcha appear below password -->
        <div class="optional-zone">
          <div class="row g-2">
            <div class="col-12">
              <label class="form-label" for="otp">OTP</label>
              <input id="otp" class="form-control" type="text" inputmode="numeric" placeholder="Enter 6-digit OTP" maxlength="6" />
            </div>
            <div class="col-7">
              <label class="form-label" for="captchaInput">Captcha</label>
              <input id="captchaInput" class="form-control" type="text" placeholder="Type captcha" />
            </div>
            <div class="col-5">
              <label class="form-label">&nbsp;</label>
              <div class="captcha-box">4K7P9</div>
            </div>
          </div>
        </div>

        <div class="d-grid mt-3">
          <button class="btn btn-primary" type="submit">
            <i class="bi bi-box-arrow-in-right"></i> Sign In
          </button>
        </div>
      </form>

      <div class="d-flex justify-content-between align-items-center mt-3 helper-line">
        <span><i class="bi bi-shield-lock"></i> 2FA enabled</span>
        <a href="#" class="text-decoration-none">Forgot password?</a>
      </div>
    </div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"
  ></script>
</body>
</html>
