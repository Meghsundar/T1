<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pharma ERP - Material Form</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-form">
  <div class="erp-shell" id="erpShell">
    <aside class="erp-sidebar">
      <div class="brand">
        <i class="bi bi-capsule-pill"></i>
        <span class="brand-name">Pharma ERP</span>
      </div>

      <nav class="menu-wrap">
        <button class="menu-link"><i class="bi bi-speedometer2"></i><span class="menu-text">Dashboard</span></button>
        <button class="menu-link submenu-toggle" data-bs-toggle="collapse" data-bs-target="#submenuProduction"><i class="bi bi-gear-wide-connected"></i><span class="menu-text">Production</span></button>
        <div class="submenu-list collapse" id="submenuProduction">
          <button class="submenu-link"><i class="bi bi-dot"></i><span class="menu-text">Production Planning</span></button>
          <button class="submenu-link"><i class="bi bi-dot"></i><span class="menu-text">Batch Execution</span></button>
        </div>
        <button class="menu-link"><i class="bi bi-clipboard2-pulse"></i><span class="menu-text">Quality Control</span></button>
        <button class="menu-link"><i class="bi bi-shield-check"></i><span class="menu-text">Quality Assurance</span></button>
        <button class="menu-link active submenu-toggle" data-bs-toggle="collapse" data-bs-target="#submenuInventory"><i class="bi bi-box-seam"></i><span class="menu-text">Inventory</span></button>
        <div class="submenu-list collapse show" id="submenuInventory">
          <button class="submenu-link active"><i class="bi bi-dot"></i><span class="menu-text">Material Master</span></button>
          <button class="submenu-link"><i class="bi bi-dot"></i><span class="menu-text">Stock Ledger</span></button>
        </div>
        <button class="menu-link"><i class="bi bi-truck"></i><span class="menu-text">Distribution</span></button>
        <button class="menu-link"><i class="bi bi-cash-stack"></i><span class="menu-text">Accounts</span></button>
        <button class="menu-link"><i class="bi bi-people"></i><span class="menu-text">CRM / Clients</span></button>
        <button class="menu-link"><i class="bi bi-sliders"></i><span class="menu-text">Settings</span></button>
      </nav>

      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar" title="Collapse / expand menu">
        <i class="bi bi-arrow-left"></i>
        <span class="toggle-label">Collapse</span>
      </button>
    </aside>

    <main class="erp-main form-main">
      <div class="content-header d-flex align-items-center justify-content-between">
        <div>Material Master <span class="sub">/ Add Data</span></div>
        <button class="btn btn-outline-primary btn-sm"><i class="bi bi-files"></i> Copy From</button>
      </div>

      <div class="form-toolbar">
        <span class="label-chip">Draft</span>
        <button class="btn btn-success btn-sm"><i class="bi bi-check2"></i> Save</button>
        <button class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-clockwise"></i> Reset</button>
        <button class="btn btn-outline-primary btn-sm"><i class="bi bi-printer"></i> Print</button>
      </div>

      <div class="material-form">
        <div class="form-card">
          <div class="row g-2">
            <div class="col-md-2">
              <label class="form-label">Material ID</label>
              <input class="form-control" placeholder="Auto" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Material Name *</label>
              <input class="form-control" />
            </div>
            <div class="col-md-2">
              <label class="form-label">Category Type</label>
              <select class="form-select"><option>Raw Material</option></select>
            </div>
            <div class="col-md-2">
              <label class="form-label">Item Group</label>
              <input class="form-control" />
            </div>
            <div class="col-md-2">
              <label class="form-label">Department</label>
              <input class="form-control" />
            </div>

            <div class="col-md-2">
              <label class="form-label">UOM *</label>
              <select class="form-select"><option>Purchase</option></select>
            </div>
            <div class="col-md-2">
              <label class="form-label">Consumption *</label>
              <input class="form-control" />
            </div>
            <div class="col-md-2">
              <label class="form-label">Code Req.</label>
              <select class="form-select"><option>Yes</option></select>
            </div>
            <div class="col-md-2">
              <label class="form-label">HSN / SAC *</label>
              <input class="form-control" />
            </div>
            <div class="col-md-2">
              <label class="form-label">Material Code *</label>
              <input class="form-control" />
            </div>
            <div class="col-md-2">
              <label class="form-label">Nil GST Type</label>
              <select class="form-select"><option>-- Select --</option></select>
            </div>
          </div>
        </div>

        <ul class="nav nav-tabs" id="materialTabs" role="tablist">
          <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#qa" type="button">QA Details</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#purchase" type="button">Purchase Details</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#history" type="button">Purchase History</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#consume" type="button">Consume In</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#stock" type="button">Stock</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#additional" type="button">Additional Info</button></li>
        </ul>

        <div class="tab-content border border-top-0 bg-white p-2 rounded-bottom">
          <div class="tab-pane fade show active" id="qa">
            <div class="row g-2 grid-row">
              <div class="col-md-3"><label class="form-label">For Which</label><input class="form-control" /></div>
              <div class="col-md-3"><label class="form-label">Chemical / Generic Name</label><input class="form-control" /></div>
              <div class="col-md-2"><label class="form-label">CAS No.</label><input class="form-control" /></div>
              <div class="col-md-2"><label class="form-label">Therapeutic Category *</label><input class="form-control" /></div>
              <div class="col-md-2"><label class="form-label">Storage Condition *</label><select class="form-select"><option>Ambient</option></select></div>
            </div>
            <div class="row g-2 grid-row">
              <div class="col-md-2"><label class="form-label">Nature</label><select class="form-select"><option>Solid</option></select></div>
              <div class="col-md-2"><label class="form-label">Shelf Life (Month)</label><input class="form-control" /></div>
              <div class="col-md-2"><label class="form-label">Retest After (Month)</label><input class="form-control" /></div>
              <div class="col-md-2"><label class="form-label">Minimum Shelf Life</label><input class="form-control" /></div>
              <div class="col-md-2"><label class="form-label">Q.C. Lead Time</label><input class="form-control" /></div>
              <div class="col-md-2"><label class="form-label">Sampling Principle *</label><select class="form-select"><option>Standard</option></select></div>
            </div>

            <div class="row g-2">
              <div class="col-lg-6">
                <div class="sub-panel">
                  <div class="small-heading">Purchase Specification</div>
                  <textarea class="form-control" rows="4"></textarea>
                </div>
              </div>
              <div class="col-lg-6">
                <div class="sub-panel">
                  <div class="small-heading">Equivalent to / Factor</div>
                  <div class="table-responsive">
                    <table class="table table-bordered table-sm mb-0">
                      <thead>
                        <tr><th>Equivalent To</th><th>Factor</th></tr>
                      </thead>
                      <tbody>
                        <tr><td><input class="form-control form-control-sm" /></td><td><input class="form-control form-control-sm" /></td></tr>
                        <tr><td><input class="form-control form-control-sm" /></td><td><input class="form-control form-control-sm" /></td></tr>
                        <tr><td><input class="form-control form-control-sm" /></td><td><input class="form-control form-control-sm" /></td></tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="tab-pane fade" id="purchase">
            <div class="row g-2">
              <div class="col-md-3"><label class="form-label">Preferred Vendor</label><input class="form-control" /></div>
              <div class="col-md-2"><label class="form-label">Lead Time (Days)</label><input class="form-control" /></div>
              <div class="col-md-2"><label class="form-label">MOQ</label><input class="form-control" /></div>
              <div class="col-md-2"><label class="form-label">Rate Contract</label><select class="form-select"><option>No</option></select></div>
              <div class="col-md-3"><label class="form-label">Remarks</label><input class="form-control" /></div>
            </div>
          </div>

          <div class="tab-pane fade" id="history">
            <div class="table-responsive">
              <table class="table table-bordered table-sm">
                <thead><tr><th>Date</th><th>PO Number</th><th>Vendor</th><th>Qty</th><th>Rate</th></tr></thead>
                <tbody>
                  <tr><td>2026-03-01</td><td>PO-1109</td><td>MedSource</td><td>500</td><td>1250</td></tr>
                  <tr><td>2026-01-20</td><td>PO-1087</td><td>ChemPro</td><td>300</td><td>1230</td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <div class="tab-pane fade" id="consume">
            <div class="row g-2">
              <div class="col-md-3"><label class="form-label">Production Unit</label><select class="form-select"><option>Tablet</option></select></div>
              <div class="col-md-3"><label class="form-label">Batch Size</label><input class="form-control" /></div>
              <div class="col-md-3"><label class="form-label">Std. Consumption</label><input class="form-control" /></div>
              <div class="col-md-3"><label class="form-label">Tolerance %</label><input class="form-control" /></div>
            </div>
          </div>

          <div class="tab-pane fade" id="stock">
            <div class="row g-2">
              <div class="col-md-3"><label class="form-label">Reorder Level</label><input class="form-control" /></div>
              <div class="col-md-3"><label class="form-label">Max Stock</label><input class="form-control" /></div>
              <div class="col-md-3"><label class="form-label">Safety Stock</label><input class="form-control" /></div>
              <div class="col-md-3"><label class="form-label">Warehouse</label><select class="form-select"><option>Main</option></select></div>
            </div>
          </div>

          <div class="tab-pane fade" id="additional">
            <div class="row g-2">
              <div class="col-md-3"><label class="form-label">Regulatory Class</label><input class="form-control" /></div>
              <div class="col-md-3"><label class="form-label">Controlled Substance</label><select class="form-select"><option>No</option></select></div>
              <div class="col-md-3"><label class="form-label">Audit Frequency</label><select class="form-select"><option>Quarterly</option></select></div>
              <div class="col-md-3"><label class="form-label">Notes</label><input class="form-control" /></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="status-bar">
      <div class="status-left">
        <span>Malay Bhalodiya</span>
        <span>|</span>
        <span>Role: Admin</span>
        <span>|</span>
        <span><span class="dot"></span> System Healthy</span>
      </div>
      <div class="status-right">
        <i class="bi bi-gear-fill"></i>
        <span>More</span>
        <i class="bi bi-chevron-down"></i>
      </div>
    </footer>
  </div>

  <script>
    const shell = document.getElementById('erpShell');
    const toggleBtn = document.getElementById('sidebarToggle');

    toggleBtn.addEventListener('click', () => {
      shell.classList.toggle('sidebar-collapsed');
      const icon = toggleBtn.querySelector('i');
      const label = toggleBtn.querySelector('.toggle-label');
      const collapsed = shell.classList.contains('sidebar-collapsed');

      icon.className = collapsed ? 'bi bi-arrow-right' : 'bi bi-arrow-left';
      label.textContent = collapsed ? 'Expand' : 'Collapse';
    });
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"
  ></script>
</body>
</html>
